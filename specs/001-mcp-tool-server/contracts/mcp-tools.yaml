# MCP Tool Contracts

**Feature**: MCP Tool Server  
**Branch**: `001-mcp-tool-server`  
**Date**: 2026-02-22  
**Purpose**: Define explicit tool schemas following MCP protocol

---

## Tool 1: add_task

**Purpose**: Create a new task owned by the authenticated user

### Tool Definition

```yaml
name: add_task
description: Create a new task with title, optional description, and optional due date
version: 1.0.0
```

### Input Schema

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "properties": {
    "title": {
      "type": "string",
      "minLength": 1,
      "maxLength": 500,
      "description": "Task title or brief description"
    },
    "description": {
      "type": ["string", "null"],
      "maxLength": 2000,
      "description": "Detailed task description (optional)"
    },
    "due_date": {
      "type": ["string", "null"],
      "format": "date-time",
      "description": "Task due date in ISO 8601 format (optional)"
    }
  },
  "required": ["title"],
  "additionalProperties": false
}
```

### Output Schema (Success)

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "properties": {
    "success": {
      "type": "boolean",
      "const": true
    },
    "data": {
      "type": "object",
      "properties": {
        "task_id": { "type": "integer" },
        "title": { "type": "string" },
        "description": { "type": ["string", "null"] },
        "due_date": { "type": ["string", "null"], "format": "date-time" },
        "completed": { "type": "boolean", "const": false },
        "completed_at": { "type": ["string", "null"] },
        "created_at": { "type": "string", "format": "date-time" },
        "updated_at": { "type": "string", "format": "date-time" },
        "user_id": { "type": "integer" }
      },
      "required": ["task_id", "title", "completed", "created_at", "updated_at", "user_id"]
    },
    "error": { "type": "null" }
  },
  "required": ["success", "data", "error"]
}
```

### Error Responses

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "INVALID_INPUT",
    "message": "Validation failed: title is required and must be 1-500 characters",
    "details": {
      "field": "title",
      "reason": "min_length"
    }
  }
}
```

### Example Invocation

**Request**:
```json
{
  "title": "Buy groceries",
  "description": "Milk, eggs, bread, vegetables",
  "due_date": "2026-02-25T18:00:00Z"
}
```

**Response**:
```json
{
  "success": true,
  "data": {
    "task_id": 123,
    "title": "Buy groceries",
    "description": "Milk, eggs, bread, vegetables",
    "due_date": "2026-02-25T18:00:00Z",
    "completed": false,
    "completed_at": null,
    "created_at": "2026-02-22T10:30:00Z",
    "updated_at": "2026-02-22T10:30:00Z",
    "user_id": 456
  },
  "error": null
}
```

