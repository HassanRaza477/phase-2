  "data": {
    "task_id": 123,
    "title": "Buy organic groceries",
    "description": "Milk, eggs, bread, vegetables",
    "due_date": "2026-02-26T18:00:00Z",
    "completed": false,
    "completed_at": null,
    "created_at": "2026-02-22T10:30:00Z",
    "updated_at": "2026-02-22T11:00:00Z",
    "user_id": 456
  },
  "error": null
}
```

