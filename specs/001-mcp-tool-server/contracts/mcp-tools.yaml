## Common Error Response Format

All tools use standardized error responses:

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "ERROR_CODE",
    "message": "Human-readable message",
    "details": {
      "field_specific": "details"
    }
  }
}
```

### Error Code Reference

| Code | HTTP Status | When Returned |
|------|-------------|---------------|
| `INVALID_INPUT` | 400 | Schema validation failed |
| `UNAUTHORIZED` | 401 | JWT missing, expired, or invalid |
| `TASK_NOT_FOUND` | 404 | Task doesn't exist or user lacks ownership |
| `FORBIDDEN` | 403 | Operation not allowed (e.g., update user_id) |
| `DATABASE_ERROR` | 500 | Database operation failed |

### Example: Validation Error

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "INVALID_INPUT",
    "message": "Validation failed: title must be at least 1 character",
    "details": {
      "field": "title",
      "reason": "min_length",
      "min_length": 1,
      "provided_length": 0
    }
  }
}
```

### Example: Unauthorized Error

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "UNAUTHORIZED",
    "message": "Authentication required: invalid or expired token",
    "details": {
      "reason": "token_expired"
    }
  }
}
```

### Example: Task Not Found Error

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "TASK_NOT_FOUND",
    "message": "The requested task was not found",
    "details": {
      "task_id": 999
    }
  }
}
```

**Security Note**: Same error message for "task doesn't exist" and "task belongs to another user" to prevent information disclosure.

---

## Authentication Requirements

All tool invocations require:

1. **JWT Token**: Passed in `Authorization: Bearer <token>` header
2. **Valid Signature**: Token signed with server's secret key
3. **Not Expired**: `exp` claim in future
4. **Valid User**: `user_id` claim present and valid

**Token Extraction** (handled by MCP server, not tool input):

```
Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
```

**User Isolation**: All database queries automatically filtered by authenticated `user_id`.

