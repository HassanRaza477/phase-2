## Tool 2: list_tasks

**Purpose**: Retrieve all tasks belonging to the authenticated user

### Tool Definition

```yaml
name: list_tasks
description: List all tasks owned by the authenticated user, optionally filtered by status
version: 1.0.0
```

### Input Schema

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "properties": {
    "status": {
      "type": ["string", "null"],
      "enum": ["active", "completed", null],
      "description": "Filter tasks by status (optional)"
    }
  },
  "additionalProperties": false
}
```

### Output Schema (Success)

```json
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "type": "object",
  "properties": {
    "success": {
      "type": "boolean",
      "const": true
    },
    "data": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "task_id": { "type": "integer" },
          "title": { "type": "string" },
          "description": { "type": ["string", "null"] },
          "due_date": { "type": ["string", "null"], "format": "date-time" },
          "completed": { "type": "boolean" },
          "completed_at": { "type": ["string", "null"], "format": "date-time" },
          "created_at": { "type": "string", "format": "date-time" },
          "updated_at": { "type": "string", "format": "date-time" },
          "user_id": { "type": "integer" }
        },
        "required": ["task_id", "title", "completed", "created_at", "updated_at", "user_id"]
      }
    },
    "error": { "type": "null" }
  },
  "required": ["success", "data", "error"]
}
```

### Error Responses

```json
{
  "success": false,
  "data": null,
  "error": {
    "code": "INVALID_INPUT",
    "message": "Invalid status filter. Must be 'active', 'completed', or null",
    "details": {
      "field": "status",
      "reason": "invalid_enum"
    }
  }
}
```

### Example Invocation

**Request** (no filter):
```json
{}
```

**Request** (active only):
```json
{
  "status": "active"
}
```

**Response**:
```json
{
  "success": true,
  "data": [
    {
      "task_id": 123,
      "title": "Buy groceries",
      "description": "Milk, eggs, bread",
      "due_date": "2026-02-25T18:00:00Z",
      "completed": false,
      "completed_at": null,
      "created_at": "2026-02-22T10:30:00Z",
      "updated_at": "2026-02-22T10:30:00Z",
      "user_id": 456
    },
    {
      "task_id": 124,
      "title": "Finish report",
      "description": null,
      "due_date": null,
      "completed": true,
      "completed_at": "2026-02-21T15:00:00Z",
      "created_at": "2026-02-20T09:00:00Z",
      "updated_at": "2026-02-21T15:00:00Z",
      "user_id": 456
    }
  ],
  "error": null
}
```

